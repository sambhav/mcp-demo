[project]
name = "skills-mcp"
version = "0.1.0"
description = "A basic MCP server that serves Agent Skills (SKILL.md folders) to any MCP client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "pyyaml>=6"]

[project.scripts]
skills-mcp = "skills_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_mcp"]
